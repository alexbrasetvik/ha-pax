name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: hacs/action@main
        with:
          category: integration
          # brands: no brand icon yet; add custom_components/pax/brand/ and drop it.
          # topics: only needed to be listed in the HACS default store, not to install
          # as a custom repository.
          ignore: brands topics

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # Installs the Python in .python-version and caches downloads keyed on uv.lock.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      # The same checks as `mise run check`.
      - run: uv run ruff check custom_components/ tests/
      - run: uv run ruff format --check custom_components/ tests/
      - run: uv run mypy
      - run: uv run pytest
